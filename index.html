<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Training">
<meta name="theme-color" content="#121211">
<title>Training</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<style>
  :root{
    --bg:#121211; --surface:#1a1a19; --surface-2:#232321; --surface-3:#2d2d2a;
    --line:#383835; --text:#f0efec; --text-2:#c3c2b7; --muted:#8d8c84;
    --accent:#3987e5; --accent-strong:#6da7ec; --accent-soft:rgba(57,135,229,.16);
    --good:#0ca30c; --good-text:#3fc23f; --good-soft:rgba(12,163,12,.18); --critical:#e66767;
    --radius:16px;
    --safe-top:env(safe-area-inset-top,0px); --safe-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#f3f3f1; --surface:#fcfcfb; --surface-2:#f0efec; --surface-3:#e6e5e1;
      --line:#dddcd7; --text:#0b0b0b; --text-2:#52514e; --muted:#77766f;
      --accent:#2a78d6; --accent-strong:#1c5cab; --accent-soft:rgba(42,120,214,.12);
      --good:#0a8a0a; --good-text:#087a08; --good-soft:rgba(12,163,12,.14); --critical:#d03b3b;
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.4}
  body{min-height:100vh;padding-top:var(--safe-top);padding-bottom:calc(84px + var(--safe-bottom))}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer;border:0;background:none;padding:0}
  .wrap{max-width:640px;margin:0 auto;padding:0 16px}

  header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 0 10px}
  header.top h1{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:0}
  .sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);padding:5px 10px;border-radius:99px;white-space:nowrap}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
  .dot.ok{background:var(--good)} .dot.busy{background:var(--accent)}

  h2{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 0 10px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px}
  .row{display:flex;align-items:center;gap:10px}
  .between{justify-content:space-between}
  .grow{flex:1;min-width:0}
  .muted{color:var(--muted)} .small{font-size:13px} .t2{color:var(--text-2)}
  .title{font-weight:700;font-size:17px}
  .ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:46px;padding:0 18px;border-radius:12px;font-weight:600;background:var(--surface-2);border:1px solid var(--line)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.danger{color:var(--critical)}
  .btn.block{width:100%}
  .btn.sm{height:36px;padding:0 12px;font-size:14px;border-radius:10px}
  .btn:active{transform:scale(.98)}
  .icon-btn{width:40px;height:40px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;color:var(--text-2)}
  .icon-btn:active{background:var(--surface-2)}

  /* day switcher */
  .day{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px}
  .day .lbl{flex:1;text-align:center;font-weight:700}
  .stopwatch{text-align:center;padding:20px 16px}
  .sw-clock{font-size:56px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--accent-strong);line-height:1.1}
  .sw-clock.idle{color:var(--muted)}
  .sw-btn{height:60px;font-size:20px;margin-top:14px;border-radius:16px;color:#fff}
  .sw-btn.go{background:var(--good);border-color:var(--good)}
  .sw-btn.stop{background:var(--critical);border-color:var(--critical)}
  .badge.run{background:var(--accent)}
  .timerbar{margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:14px;font-variant-numeric:tabular-nums}
  .timerbar .end-btn{color:var(--critical);height:34px;flex:none}
  .timerbar .tclock{color:var(--accent-strong);font-size:16px}
  .day .sub{display:block;font-size:12px;font-weight:500;color:var(--muted)}

  /* exercise grid */
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  @media (min-width:520px){.grid{grid-template-columns:repeat(4,1fr)}}
  .tile{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-height:118px}
  .tile:active{transform:scale(.97)}
  .tile .ic{width:64px;height:64px;color:var(--accent)}
  .tile .nm{font-size:13px;font-weight:600;line-height:1.2;hyphens:auto;-webkit-hyphens:auto;word-break:break-word}
  .tile.done{border-color:var(--good);background:linear-gradient(var(--good-soft),var(--good-soft)),var(--surface)}
  .tile .badge{position:absolute;top:6px;right:6px;background:var(--good);color:#fff;font-size:11px;font-weight:700;border-radius:99px;padding:2px 7px}
  .tile .last{font-size:11px;font-weight:600;color:var(--text-2);background:var(--surface-2);border-radius:99px;padding:2px 7px;font-variant-numeric:tabular-nums}
  .tile.done .last{background:var(--surface)}
  .tile.add{justify-content:center;color:var(--muted);border-style:dashed}
  .tile.add .plus{font-size:30px;line-height:1}

  /* icons */
  svg.ex{display:block;overflow:visible}
  svg.ex .fg{fill:none;stroke:currentColor;stroke-width:4.2;stroke-linecap:round;stroke-linejoin:round}
  svg.ex .hd{fill:currentColor}
  svg.ex .eq{fill:none;stroke:var(--text-2);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
  svg.ex .eqf{fill:var(--text-2)}
  svg.ex .gr{stroke:var(--line);stroke-width:2.5;stroke-linecap:round}

  /* exercise screen */
  .ex-hero{display:flex;align-items:center;gap:14px;margin:4px 0 14px}
  .ex-hero .ic{width:84px;height:84px;flex:none;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:8px;color:var(--accent)}
  .ex-hero h2{all:unset;font-size:24px;font-weight:800;letter-spacing:-.02em;display:block;line-height:1.15}
  .target{background:var(--accent-soft);border-radius:14px;padding:12px 14px;margin-bottom:12px}
  .target b{color:var(--accent-strong)}
  .sets{width:100%;border-collapse:separate;border-spacing:0 8px}
  .sets th{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;text-align:center;padding:0 4px}
  .sets td{text-align:center;padding:0 4px;vertical-align:middle}
  .sets td.n{width:34px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
  .sets input{width:100%;height:52px;text-align:center;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;outline:none;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
  .sets input:focus{border-color:var(--accent)}
  .sets .prev{font-size:11px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}
  .sets tr.up input{border-color:var(--good)}
  .sets tr.tgt td{padding-top:6px}
  .sets tr.tgt + tr td{padding-top:0}
  .goal{font-size:12px;font-weight:600;color:var(--accent-strong);text-align:left;padding:0 2px;margin-bottom:-4px}
  .goal.hit{color:var(--good-text)}
  .pr{display:inline-block;font-size:11px;font-weight:700;color:#fff;background:var(--good);border-radius:99px;padding:2px 7px;margin-left:6px;vertical-align:2px}
  .delta{font-weight:700}
  .delta.up{color:var(--good-text)} .delta.down{color:var(--critical)}

  /* tabs */
  nav.tabs{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:var(--safe-bottom);z-index:20}
  nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
  nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 8px;font-size:11px;font-weight:500;color:var(--muted)}
  nav.tabs button.on{color:var(--accent)}
  nav.tabs svg{width:24px;height:24px}

  /* forms */
  input.f,select.f,textarea.f{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;height:44px;padding:0 12px;outline:none}
  textarea.f{height:140px;padding:10px 12px;font-family:ui-monospace,monospace;font-size:12px}
  input.f:focus,select.f:focus,textarea.f:focus{border-color:var(--accent)}
  label.lab{display:block;font-size:12px;color:var(--muted);margin:12px 0 6px}
  .icon-pick{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-height:230px;overflow:auto}
  .icon-pick button{border:2px solid transparent;border-radius:12px;background:var(--surface-2);padding:4px;color:var(--accent)}
  .icon-pick button.on{border-color:var(--accent)}
  .icon-pick svg{width:100%;height:auto}

  /* history */
  .sess-ex{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
  .sess-ex:first-of-type{border-top:0}
  .sess-ex .ic{width:34px;height:34px;flex:none;color:var(--accent)}

  /* chart */
  .chart-wrap{position:relative}
  .chart svg{display:block;width:100%;height:auto;overflow:visible;touch-action:pan-y}
  .tip{position:absolute;pointer-events:none;background:var(--surface-3);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:12px;white-space:nowrap;transform:translate(-50%,-100%);display:none}
  .tip b{font-size:14px}
  .seg{display:flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:3px}
  .seg button{flex:1;height:34px;border-radius:8px;font-size:13px;font-weight:600;color:var(--text-2)}
  .seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;width:76px;padding:6px 4px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:11px;font-weight:600;color:var(--text-2)}
  .chip svg{width:40px;height:40px;color:var(--accent)}
  .chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--text)}
  .chip span{width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  table.data{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
  table.data th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;font-weight:600;padding:6px 0}
  table.data td{padding:8px 0;border-top:1px solid var(--line)}
  table.data .r{text-align:right}
  table.data td:first-child{white-space:nowrap;padding-right:12px}

  .empty{text-align:center;padding:30px 16px;color:var(--muted)}
  .empty .big{font-size:40px;margin-bottom:6px}

  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:12px;padding-bottom:calc(12px + var(--safe-bottom))}
  .modal{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;width:100%;max-width:480px;max-height:90vh;overflow:auto}
  .modal h3{margin:0 0 8px;font-size:18px}
  .modal .acts{display:flex;gap:10px;margin-top:16px}
  .modal .acts .btn{flex:1}
  .toast{position:fixed;left:50%;top:calc(14px + var(--safe-top));transform:translateX(-50%);background:var(--surface-3);border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.3);white-space:nowrap}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 id="hdr">Training</h1>
    <div class="sync" id="sync"><span class="dot busy"></span><span>Lädt…</span></div>
  </header>
  <main id="main"></main>
</div>
<nav class="tabs"><div class="in" id="tabs"></div></nav>

<script>
const STANDALONE = true;
/* ================= Helpers ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const num = v => { const n = parseFloat(String(v ?? '').replace(',', '.')); return isFinite(n) ? n : null; };
const fmtNum = n => n == null ? '–' : (Math.round(n * 10) / 10).toLocaleString('de-DE');
const norm = s => String(s || '').trim().toLowerCase();
const e1rm = (w, r) => (r == null || r <= 0) ? null : (w == null || w <= 0 ? null : (r === 1 ? w : w * (1 + r / 30)));
const lsGet = k => { try { return JSON.parse(localStorage.getItem(k)); } catch(e) { return null; } };
const lsSet = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} };
const pad = n => String(n).padStart(2, '0');
const dayKey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const keyDate = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const todayKey = () => dayKey(new Date());
const shiftKey = (k, n) => { const d = keyDate(k); d.setDate(d.getDate() + n); return dayKey(d); };
const fmtKey = (k, o) => keyDate(k).toLocaleDateString('de-DE', o || { weekday: 'short', day: '2-digit', month: '2-digit', year: '2-digit' });
const relDay = k => { const t = todayKey(); if (k === t) return 'Heute'; if (k === shiftKey(t, -1)) return 'Gestern'; return fmtKey(k, { weekday: 'long' }); };
const startOfWeekKey = () => { const d = new Date(); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return dayKey(d); };
const SV = {
  back:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  left:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  right:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
  x:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  dots:'<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>',
  down:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>',
  up:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>',
};

/* ================= Exercise pictograms ================= */
const P = (...pts) => `<polyline class="fg" points="${pts.map(p => p.join(',')).join(' ')}"/>`;
const EQ = (...pts) => `<polyline class="eq" points="${pts.map(p => p.join(',')).join(' ')}"/>`;
const head = (x, y) => `<circle class="hd" cx="${x}" cy="${y}" r="5"/>`;
// person: s=shoulder, p=pelvis, legs=[[knee,foot]], arms=[[elbow,hand]]
const fig = o => P(o.s, o.p) + (o.legs || []).map(l => P(o.p, ...l)).join('') + (o.arms || []).map(a => P(o.s, ...a)).join('') + head(...o.h);
const plate = (x, y, r = 7) => `<circle class="eq" cx="${x}" cy="${y}" r="${r}"/><circle class="eqf" cx="${x}" cy="${y}" r="1.8"/>`;
const barH = (x1, x2, y) => `<line class="eq" x1="${x1}" y1="${y}" x2="${x2}" y2="${y}"/><rect class="eqf" x="${x1}" y="${y-6}" width="3.5" height="12" rx="1"/><rect class="eqf" x="${x2-3.5}" y="${y-6}" width="3.5" height="12" rx="1"/>`;
const dbH = (x, y) => `<line class="eq" x1="${x-6}" y1="${y}" x2="${x+6}" y2="${y}"/><rect class="eqf" x="${x-8}" y="${y-4.5}" width="4" height="9" rx="1"/><rect class="eqf" x="${x+4}" y="${y-4.5}" width="4" height="9" rx="1"/>`;
const dbV = (x, y) => `<line class="eq" x1="${x}" y1="${y-6}" x2="${x}" y2="${y+6}"/><rect class="eqf" x="${x-4.5}" y="${y-8}" width="9" height="4" rx="1"/><rect class="eqf" x="${x-4.5}" y="${y+4}" width="9" height="4" rx="1"/>`;
const ground = (x1 = 6, x2 = 58, y = 58) => `<line class="gr" x1="${x1}" y1="${y}" x2="${x2}" y2="${y}"/>`;

const ICONS = {
  treadmill: `<rect class="eq" x="6" y="50" width="46" height="6" rx="3"/>` + EQ([48,50],[52,24],[44,22]) + EQ([44,30],[38,32]) +
    fig({ h:[27,11], s:[26,19], p:[25,35], legs:[[[34,41],[31,49]],[[19,43],[12,46]]], arms:[[[32,25],[37,21]],[[20,26],[16,31]]] }),
  rower: EQ([4,54],[58,54]) + EQ([10,54],[10,58]) + EQ([52,54],[52,58]) + `<circle class="eq" cx="52" cy="44" r="7"/>` + EQ([18,50],[26,50]) +
    EQ([24,34],[48,42]) + `<rect class="eq" x="42" y="40" width="3.5" height="12" rx="1"/>` +
    fig({ h:[13,24], s:[16,32], p:[22,47], legs:[[[33,36],[42,46]]], arms:[[[14,40],[24,34]]] }),
  stepper: EQ([20,58],[20,49],[32,49],[32,40],[44,40],[44,31],[58,31]) +
    fig({ h:[33,7], s:[33,15], p:[32,30], legs:[[[27,40],[28,49]],[[40,32],[40,40]]], arms:[[[38,21],[42,16]],[[28,21],[25,26]]] }),
  bike: ground() + EQ([20,58],[26,46],[44,46]) + EQ([26,46],[22,30]) + EQ([17,30],[27,30]) + EQ([38,46],[44,22],[50,21]) + `<circle class="eq" cx="44" cy="50" r="6"/>` +
    fig({ h:[40,9], s:[34,16], p:[23,28], legs:[[[33,36],[30,46]],[[30,32],[36,42]]], arms:[[[42,19],[48,22]]] }),
  bench: ground() + EQ([10,42],[48,42]) + EQ([14,42],[14,58]) + EQ([44,42],[44,58]) +
    fig({ h:[11,33], s:[18,36], p:[38,37], legs:[[[47,30],[52,57]]], arms:[[[19,26],[20,15]]] }) + barH(6, 34, 13),
  benchbb: EQ([12,46],[52,46]) + EQ([18,46],[18,58]) + EQ([46,46],[46,58]) + ground() +
    `<line class="eq" x1="3" y1="16" x2="61" y2="16"/><rect class="eqf" x="5" y="7" width="5" height="18" rx="1.5"/><rect class="eqf" x="11" y="10" width="3" height="12" rx="1"/><rect class="eqf" x="54" y="7" width="5" height="18" rx="1.5"/><rect class="eqf" x="50" y="10" width="3" height="12" rx="1"/>` +
    P([22,42],[42,42]) + P([22,42],[17,30],[21,17]) + P([42,42],[47,30],[43,17]) + head(32,36),
  incline: ground() + EQ([20,50],[40,50]) + EQ([16,24],[30,50]) + EQ([30,50],[30,58]) +
    fig({ h:[18,19], s:[22,27], p:[33,46], legs:[[[45,40],[47,57]]], arms:[[[29,21],[31,10]]] }) + barH(16, 46, 9),
  fly: ground() + fig({ h:[32,11], s:[32,20], p:[32,40], legs:[[[25,48],[25,58]],[[39,48],[39,58]]], arms:[[[19,25],[27,16]],[[45,25],[37,16]]] }) +

const S = {
  custom: [],          // [{id,name,icon,cat}]
  hidden: [],          // ids of built-ins the user removed
  days: {},            // key -> {date, entries:[{exId,name,icon,sets:[{w,r}]}]}

const exById = id => BUILTIN.find(b => b.id === id) || S.custom.find(c => c.id === id);
const sortedDayKeys = () => Object.keys(S.days).filter(k => (S.days[k].entries || []).some(e => validSets(e.sets).length)).sort().reverse();
const validSets = sets => (sets || []).filter(s => s.w != null || s.r != null || s.m != null);
const isCardio = id => { const x = exById(id); return !!(x && x.kind === 'cardio'); };

const Store = {
  mode: 'local', db: null, uid: null, chain: Promise.resolve(), timers: {},
  setSync(state, text) { $('#sync').innerHTML = `<span class="dot ${state}"></span><span>${esc(text)}</span>`; },
  loadCache() { const c = lsGet('tt_cache'); if (c) { S.custom = c.custom || []; S.hidden = c.hidden || []; S.days = c.days || {}; } },
  saveCache() { lsSet('tt_cache', { custom: S.custom, hidden: S.hidden, days: S.days }); },
  col() { return this.db.collection('data/users/' + this.uid); },
  async init() {
    this.loadCache(); render();
    if (STANDALONE) { $('#sync').style.display = 'none'; try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {} return; }
    let c = window.claude;
    for (let i = 0; i < 30 && !(c && c.use); i++) { await new Promise(r => setTimeout(r, 100)); c = window.claude; }
    if (!(c && c.use)) { this.setSync('', 'Nur dieses Gerät'); return; }
    try {
      const [db, user] = await Promise.all([c.use('db'), c.use('user')]);
      const id = user ? await user.id() : null;
      if (!db || !id) { this.setSync('', 'Nur dieses Gerät'); return; }
      this.db = db; this.uid = id;
      this.setSync('busy', 'Synchronisiere…');
      const timeout = new Promise((_, rej) => setTimeout(() => rej({ code: 'timeout' }), 10000));
      const [setSnap, daySnap] = await Promise.race([
        Promise.all([this.col().doc('settings').get(), this.col().where('kind', '==', 'day').get()]), timeout]);
      this.mode = 'cloud';
      const cloudDays = {};
      daySnap.docs.forEach(d => { const x = d.data(); if (x && x.date) cloudDays[x.date] = JSON.parse(JSON.stringify(x)); });
      if (!setSnap.exists && !daySnap.docs.length && (S.custom.length || Object.keys(S.days).length)) {
        this.saveSettings(); Object.keys(S.days).forEach(k => this.saveDay(k, true));
      } else {
        if (setSnap.exists) { const s = setSnap.data(); S.custom = JSON.parse(JSON.stringify(s.custom || [])); S.hidden = [...(s.hidden || [])]; }
        // keep a local unsynced edit of today if cloud has nothing for it
        const keepLocal = S.days[todayKey()];
        S.days = cloudDays;
        if (keepLocal && !cloudDays[todayKey()] && keepLocal.entries.some(e => validSets(e.sets).length)) { S.days[todayKey()] = keepLocal; this.saveDay(todayKey(), true); }
        this.saveCache();
      }
      this.setSync('ok', 'Gespeichert');
      render();
    } catch (e) {
      this.mode = 'local';
      this.setSync('', e && e.code === 'timeout' ? 'Offline' : 'Nur dieses Gerät');
    }
  },
  queue(fn) {
    if (this.mode !== 'cloud') return;
    this.setSync('busy', 'Speichert…');
    this.chain = this.chain.then(fn).then(() => this.setSync('ok', 'Gespeichert'), async e => {
      if (e && e.code === 'unavailable') { await new Promise(r => setTimeout(r, 800 + Math.random() * 800)); try { await fn(); this.setSync('ok', 'Gespeichert'); return; } catch (_) {} }
      if (e && e.code === 'quota_exceeded') toast('Speicher voll – bitte alte Tage löschen.');
      this.setSync('', 'Nicht gespeichert');
    });
  },
  saveSettings() { this.saveCache(); const d = { custom: JSON.parse(JSON.stringify(S.custom)), hidden: [...S.hidden] }; this.queue(() => this.col().doc('settings').set(d)); },
  saveDay(k, now) {
    this.saveCache();
    clearTimeout(this.timers[k]);
    const run = () => {
      const day = S.days[k];
      const has = day && (day.run || day.entries.some(e => validSets(e.sets).length));
      if (has) { const d = { kind: 'day', date: k, start: day.start || null, end: day.end || null, run: day.run || null, finished: day.finished || null, entries: day.entries.map(e => ({ exId: e.exId, name: e.name, icon: e.icon, sets: validSets(e.sets).map(s => s.m != null ? ({ m: s.m }) : ({ w: s.w ?? null, r: s.r ?? null })) })).filter(e => e.sets.length) }; this.queue(() => this.col().doc('d_' + k).set(d)); }
      else this.queue(() => this.col().doc('d_' + k).delete());
    };
    if (now) run(); else this.timers[k] = setTimeout(run, 800);
  },
};

/* ================= Domain ================= */
function getEntry(k, exId, create) {
  let day = S.days[k];
  if (!day) { if (!create) return null; day = S.days[k] = { date: k, entries: [] }; }
  let e = day.entries.find(x => x.exId === exId);
  if (!e && create) { const ex = exById(exId); e = { exId, name: ex.name, icon: ex.icon, sets: [] }; day.entries.push(e); }
  return e;
}
// most recent earlier day where this exercise was logged
function previous(exId, beforeKey) {
  const keys = sortedDayKeys().filter(k => k < beforeKey);
  for (const k of keys) { const e = S.days[k].entries.find(x => x.exId === exId); if (e && validSets(e.sets).length) return { date: k, sets: validSets(e.sets) }; }
  return null;
}
function bestEver(exId, beforeKey) {
  let best = null;
  for (const k of Object.keys(S.days)) { if (k >= beforeKey) continue; const e = S.days[k].entries.find(x => x.exId === exId); if (!e) continue;
    validSets(e.sets).forEach(s => { const v = e1rm(s.w, s.r) ?? (s.r || 0); if (best == null || v > best) best = v; }); }
  return best;
}
const setsText = sets => validSets(sets).map(s => s.m != null ? fmtNum(s.m) + ' min' : (s.w != null ? fmtNum(s.w) + ' kg × ' : '') + (s.r ?? '–')).join(' · ');
const clock = sec => { sec = Math.max(0, Math.floor(sec)); const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), x = sec % 60; return (h ? h + ':' + pad(m) : m) + ':' + pad(x); };
const hhmm = t => new Date(t).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
const fmtDur = ms => { const m = Math.round(ms / 60000); return m < 60 ? m + ' min' : Math.floor(m / 60) + ' h ' + pad(m % 60) + ' min'; };
const LIVE_MS = 30 * 60000; // nach 30 min ohne Eintrag gilt das Training als beendet
function touchDay(k) { if (k !== todayKey()) return; const d = S.days[k]; if (!d) return; const now = Date.now(); if (!d.start) d.start = now; d.end = now; d.finished = null; }
function timerInfo(k) { const d = S.days[k]; if (!d || !d.start) return null; const live = !d.finished && k === todayKey() && (!!d.run || Date.now() - (d.end || d.start) < LIVE_MS); return { live, start: d.start, end: d.end || d.start }; }
function timerHTML(k) {
  const t = timerInfo(k);
  if (!t) return k === todayKey() ? '<span class="muted">⏱ Die Trainingszeit startet mit „Start“ beim Aufwärmen oder mit deinem ersten Eintrag</span>' : '';
  if (t.live) return `<div class="row between"><div>⏱ <b class="tclock" data-timer="${k}">${clock((Date.now() - t.start) / 1000)}</b> <span class="muted">seit ${hhmm(t.start)}</span></div><button class="btn sm end-btn" data-act="finish-day">■ Training beenden</button></div>`;
  return `${S.days[k].finished ? '✅ Training beendet · ' : '⏱ '}Trainingszeit <b>${fmtDur(t.end - t.start)}</b> <span class="muted">(${hhmm(t.start)}–${hhmm(t.end)})</span>`;
}
function runOf(k) { const d = S.days[k]; return d && d.run ? d.run : null; }
function startRun(k, exId) {
  if (k !== todayKey()) { toast('Start/Stopp geht nur für heute.'); return; }
  getEntry(k, exId, true); const d = S.days[k];
  if (d.run && d.run.exId !== exId) stopRun(k);
  const now = Date.now(); if (!d.start) d.start = now; d.end = now;
  d.run = { exId, t0: now }; Store.saveDay(k, true);
}
function stopRun(k) {
  const d = S.days[k]; if (!d || !d.run) return;
  const e = getEntry(k, d.run.exId, true); if (!e.sets.length) e.sets.push({ m: null });
  const mins = Math.max(1, Math.round((Date.now() - d.run.t0) / 60000));
  e.sets[0].m = (e.sets[0].m || 0) + mins;
  d.run = null; touchDay(k); Store.saveDay(k, true);
  toast(mins + ' min eingetragen');
}

  if (pts.length > 1) s += `<polyline fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${chartPts.map(p => p.x.toFixed(1) + ',' + p.y.toFixed(1)).join(' ')}"/>`;
  chartPts.forEach((p, i) => { if (pts.length <= 40 || i === chartPts.length - 1) s += `<circle cx="${p.x}" cy="${p.y}" r="4" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>`; });
  s += `<circle id="hl" r="5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2" style="display:none"/>`;
  s += `<rect id="hit" x="${L - 12}" y="0" width="${W - L - R + 24}" height="${H}" fill="transparent"/></svg>`;
  return s;
}
function wireChart() {
  const wrap = $('#chart'); if (!wrap) return;
  const svg = wrap.querySelector('svg'), tip = $('#tip'), xh = svg.querySelector('#xh'), hl = svg.querySelector('#hl');
  const show = ev => {
    const r = svg.getBoundingClientRect(), sc = 340 / r.width, cx = (ev.clientX - r.left) * sc;
    let b = chartPts[0]; chartPts.forEach(p => { if (Math.abs(p.x - cx) < Math.abs(b.x - cx)) b = p; });
    xh.setAttribute('x1', b.x); xh.setAttribute('x2', b.x); xh.style.display = '';
    hl.setAttribute('cx', b.x); hl.setAttribute('cy', b.y); hl.style.display = '';
    tip.innerHTML = `<div class="muted">${fmtKey(b.k)}</div><b>${fmtNum(b.v)} ${b.unit}</b>`;
    tip.style.display = 'block';
    tip.style.left = Math.min(Math.max(b.x / sc, 60), r.width - 60) + 'px'; tip.style.top = (b.y / sc - 10) + 'px';
  };
  const hit = svg.querySelector('#hit');
  hit.addEventListener('pointermove', show); hit.addEventListener('pointerdown', show);
  hit.addEventListener('pointerleave', () => { tip.style.display = 'none'; xh.style.display = 'none'; hl.style.display = 'none'; });
}

/* ================= Dialogs ================= */
function modal({ title, body = '', ok = 'OK', cancel = 'Abbrechen', danger = false, input = false, onOpen }) {
  return new Promise(res => {
    const bg = document.createElement('div'); bg.className = 'modal-bg';
    bg.innerHTML = `<div class="modal"><h3>${esc(title)}</h3>${body ? `<div class="t2 small">${body}</div>` : ''}
      ${input ? `<textarea class="f" id="m-in" style="margin-top:10px" placeholder="Backup hier einfügen"></textarea>` : ''}
      <div class="acts">${cancel ? `<button class="btn" data-r="0">${esc(cancel)}</button>` : ''}${ok ? `<button class="btn ${danger ? 'danger' : 'primary'}" data-r="1">${esc(ok)}</button>` : ''}</div></div>`;
    bg.addEventListener('click', e => {
      const b = e.target.closest('[data-r]');
      if (b || e.target === bg) { const yes = b && b.dataset.r === '1'; const v = yes ? (input ? bg.querySelector('#m-in').value : true) : false; bg.remove(); res(v); }
    });
    document.body.appendChild(bg);
    onOpen && onOpen(bg);
  });
}
function exerciseDialog(existing) {
  let pick = existing ? existing.icon : 'generic';
  const keys = Object.keys(ICONS);
  const body = `<label class="lab">Name</label><input class="f" id="m-name" value="${esc(existing ? existing.name : '')}" placeholder="z. B. Hammercurls">
    <label class="lab">Bild auswählen</label><div class="icon-pick" id="m-icons">${keys.map(k => `<button type="button" data-ic="${k}" class="${k === pick ? 'on' : ''}">${icon(k)}</button>`).join('')}</div>`;
  return new Promise(res => {
    modal({ title: existing ? 'Übung bearbeiten' : 'Neue Übung', body, ok: 'Speichern', onOpen: bg => {
      bg.querySelector('#m-icons').addEventListener('click', e => { const b = e.target.closest('[data-ic]'); if (!b) return; e.stopPropagation(); pick = b.dataset.ic; bg.querySelectorAll('[data-ic]').forEach(x => x.classList.toggle('on', x === b)); });
      const n = bg.querySelector('#m-name'); n.addEventListener('input', () => { window.__mname = n.value; }); window.__mname = n.value;
      if (!existing) setTimeout(() => n.focus(), 50);
    } }).then(ok => { const name = (window.__mname || '').trim(); res(ok && name ? { name, icon: pick } : null); });
  });
}
let toastT;
function toast(msg) { let t = $('.toast'); if (!t) { t = document.createElement('div'); t.className = 'toast'; document.body.appendChild(t); } t.textContent = msg; clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 2400); }

/* ================= Events ================= */
function refreshRows() {
  // re-render the exercise view but keep focus/caret
  const a = document.activeElement, sel = a && a.dataset && a.dataset.in ? [a.dataset.in, a.dataset.i, a.selectionStart] : null;
  render();
  if (sel) { const el = document.querySelector(`[data-in="${sel[0]}"][data-i="${sel[1]}"]`); if (el) { el.focus(); try { el.setSelectionRange(sel[2], sel[2]); } catch (e) {} } }
}
document.addEventListener('click', async ev => {
  const el = ev.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act;
  switch (a) {
    case 'tab': S.tab = el.dataset.tab; if (S.tab === 'today') S.ex = null; render(); window.scrollTo(0, 0); break;
    case 'day': { const n = shiftKey(S.day, +el.dataset.d); if (n > todayKey()) return; S.day = n; render(); break; }
    case 'open-ex': S.ex = el.dataset.id; render(); window.scrollTo(0, 0);
      { const e = getEntry(S.day, S.ex); if (!e || !e.sets.length) { addSet(); } } break;
    case 'finish-day': {
      const k = S.day, d = S.days[k]; if (!d) return;
      const ents = d.entries.filter(e => validSets(e.sets).length);
      const sets = ents.reduce((a, e) => a + (isCardio(e.exId) ? 0 : validSets(e.sets).length), 0);
      const dur = fmtDur(Date.now() - d.start);
      if (!await modal({ title: 'Training beenden?', body: `Dauer: <b>${dur}</b><br>${ents.length} ${ents.length === 1 ? 'Übung' : 'Übungen'} · ${sets} ${sets === 1 ? 'Satz' : 'Sätze'}`, ok: 'Beenden' })) return;
      if (d.run) stopRun(k);
      d.end = Date.now(); d.finished = d.end; Store.saveDay(k, true); S.ex = null; render(); window.scrollTo(0, 0);
      toast('Training beendet – stark! 💪');
      break;
    }
    case 'run-start': unlockAudioSafe(); startRun(S.day, S.ex); render(); break;
    case 'run-stop': stopRun(S.day); render(); break;
    case 'quick-min': { const e = getEntry(S.day, S.ex, true); if (!e.sets.length) e.sets.push({ m: null }); e.sets[0].m = +el.dataset.m; touchDay(S.day); Store.saveDay(S.day); render(); break; }
    case 'close-ex': S.ex = null; render(); window.scrollTo(0, 0); break;
    case 'add-set': addSet(true); break;
    case 'del-set': { const e = getEntry(S.day, S.ex); if (!e) return; e.sets.splice(+el.dataset.i, 1); Store.saveDay(S.day); render(); break; }
    case 'new-ex': { const r = await exerciseDialog(); if (!r) return; const x = { id: 'c_' + uid(), name: r.name, icon: r.icon, cat: 'Eigene' }; S.custom.push(x); Store.saveSettings(); render(); toast('Übung hinzugefügt'); break; }
    case 'ex-menu': {
      const x = exById(S.ex), custom = x.cat === 'Eigene' || S.custom.includes(x);
      const choice = await new Promise(res => modal({ title: x.name, ok: '', cancel: 'Schließen',
        body: `<div style="display:grid;gap:8px;margin-top:8px">${custom ? '<button class="btn block" data-ch="edit">Name / Bild ändern</button>' : ''}<button class="btn block danger" data-ch="hide">${custom ? 'Übung löschen' : 'Aus der Übersicht entfernen'}</button></div>`,
        onOpen: bg => bg.addEventListener('click', e => { const b = e.target.closest('[data-ch]'); if (b) { bg.remove(); res(b.dataset.ch); } }) }).then(() => res(null)));
      if (choice === 'edit') { const r = await exerciseDialog(x); if (r) { x.name = r.name; x.icon = r.icon; Store.saveSettings(); render(); } }
      if (choice === 'hide') {
        if (!await modal({ title: custom ? 'Übung löschen?' : 'Übung ausblenden?', body: 'Bisherige Einträge bleiben im Verlauf erhalten.', ok: custom ? 'Löschen' : 'Ausblenden', danger: true })) return;
        if (custom) S.custom = S.custom.filter(c => c.id !== x.id); else S.hidden.push(x.id);
        Store.saveSettings(); S.ex = null; render();
      }
      break;
    }
    case 'open-day': S.openDay = S.openDay === el.dataset.k ? null : el.dataset.k; render(); break;
    case 'edit-day': S.day = el.dataset.k; S.tab = 'today'; S.ex = null; render(); window.scrollTo(0, 0); break;
    case 'del-day': if (await modal({ title: 'Trainingstag löschen?', body: esc(fmtKey(el.dataset.k)), ok: 'Löschen', danger: true })) { delete S.days[el.dataset.k]; Store.saveDay(el.dataset.k, true); render(); } break;
    case 'prog-ex': S.prog.ex = el.dataset.id; render(); break;
    case 'metric': S.prog.metric = el.dataset.m; render(); break;
    case 'backup': {
      const txt = backupText();
      try { await navigator.clipboard.writeText(txt); lsSet('tt_lastBackup', Date.now()); toast('Backup kopiert – z. B. in Notizen einfügen'); render(); }
      catch (e) { modal({ title: 'Backup', body: 'Markiere den Text und kopiere ihn:<textarea class="f" style="margin-top:10px" readonly>' + esc(txt) + '</textarea>', cancel: '', ok: 'Fertig' }); }
      break;
    }
    case 'backup-file': {
      const name = 'Training-Backup-' + todayKey() + '.json';
      const blob = new Blob([backupText()], { type: 'application/json' });
      try {
        const file = new File([blob], name, { type: 'application/json' });
        if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: 'Trainings-Backup' }); }
        else { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); }
        lsSet('tt_lastBackup', Date.now()); render(); toast('Backup gesichert');
      } catch (e) { if (e && e.name !== 'AbortError') toast('Sichern hat nicht geklappt.'); }
      break;
    }
    case 'restore-file': {
      const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json,text/plain';
      inp.onchange = async () => { const f = inp.files && inp.files[0]; if (f) importBackup(await f.text()); };
      inp.click();
      break;
    }
    case 'restore': {
      const v = await modal({ title: 'Backup einfügen', body: 'Einträge aus dem Backup werden ergänzt. Bereits vorhandene Tage bleiben unverändert.', ok: 'Importieren', input: true });
      if (v) importBackup(v);
      break;
    }
  }
});
function backupText() { return JSON.stringify({ app: 'trainingstagebuch', v: 1, custom: S.custom, hidden: S.hidden, days: S.days }); }
function lastBackupText() { const t = lsGet('tt_lastBackup'); if (!t) return 'Noch kein Backup gesichert.'; const d = Math.floor((Date.now() - t) / 864e5); return 'Letztes Backup: ' + (d === 0 ? 'heute' : d === 1 ? 'gestern' : 'vor ' + d + ' Tagen'); }
function importBackup(v) {
  try {
    const d = JSON.parse(v); if (!d || typeof d.days !== 'object') throw 0;
    let n = 0;
    (d.custom || []).forEach(c => { if (c && c.id && !S.custom.some(x => x.id === c.id)) S.custom.push(c); });
    Object.entries(d.days).forEach(([k, day]) => { if (/^\d{4}-\d\d-\d\d$/.test(k) && day && Array.isArray(day.entries) && !S.days[k]) { S.days[k] = { date: k, entries: day.entries, start: day.start || null, end: day.end || null }; Store.saveDay(k, true); n++; } });
    Store.saveSettings(); render(); toast(`${n} Trainingstage importiert`);
  } catch (e) { toast('Das ist kein gültiges Backup.'); }
}
function unlockAudioSafe() {}
function addSet(focus) {
  const e = getEntry(S.day, S.ex, true);
  if (isCardio(S.ex)) { if (!e.sets.length) e.sets.push({ m: null }); Store.saveCache(); render(); return; }
  const last = e.sets[e.sets.length - 1];
  const prev = previous(S.ex, S.day);
  const pv = prev && prev.sets[e.sets.length];
  const tg = setTarget(prevSetFor(prev, e.sets.length));
  e.sets.push({ w: last ? last.w : (tg && tg.w != null ? tg.w : (pv ? pv.w : null)), r: null });
  Store.saveCache(); render();
  if (focus !== false) setTimeout(() => { const inp = document.querySelector(`[data-in="r"][data-i="${e.sets.length - 1}"]`); inp && inp.focus(); }, 30);
}
document.addEventListener('input', ev => {
  const el = ev.target; if (!el.dataset.in || !S.ex) return;
  const e = getEntry(S.day, S.ex, true), s = e.sets[+el.dataset.i]; if (!s) return;
  s[el.dataset.in] = num(el.value);
  if (s[el.dataset.in] != null) touchDay(S.day);
  Store.saveDay(S.day);
  const g = document.getElementById('goal-' + el.dataset.i);
  if (g) { const tw = g.dataset.tw === '' ? null : +g.dataset.tw, tr = +g.dataset.tr;
    const hit = s.r != null && ((s.r >= tr && (tw == null || (s.w != null && s.w >= tw - 1e-9))) || (tw != null && s.w != null && e1rm(s.w, s.r) >= e1rm(tw, tr) - 1e-9));
    g.classList.toggle('hit', hit); g.textContent = (hit ? '✓ Ziel erreicht: ' : '🎯 Ziel: ') + g.dataset.txt; }
});
document.addEventListener('keydown', ev => {
  if (ev.key !== 'Enter' || !ev.target.dataset.in) return;
  ev.preventDefault();
  const i = +ev.target.dataset.i;
  if (ev.target.dataset.in === 'w') { const r = document.querySelector(`[data-in="r"][data-i="${i}"]`); r && r.focus(); }
  else ev.target.blur();
});

Store.init();
if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); }); }
</script>
